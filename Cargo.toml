[package]
name = "fwt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast sparse worktrees for large Bazel monorepos"
license = "MIT"
repository = "https://github.com/junaidrahim/fwt"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
fs2 = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
thiserror = "2.0.16"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.21.0"

[[bin]]
name = "git-fwt"
path = "src/bin/git-fwt.rs"

[profile.release]
lto = "thin"
strip = true
