name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: '1.85.0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --locked --all-targets --all-features
      - name: Verify Cargo installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/fwt-install"
          "$RUNNER_TEMP/fwt-install/bin/fwt" --version
          "$RUNNER_TEMP/fwt-install/bin/git-fwt" --version
      - name: Smoke-test benchmark runner (local fixture, no downloads)
        run: FWT_BENCH_BINARY="$RUNNER_TEMP/fwt-install/bin/fwt" python3 scripts/test_benchmark.py

  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: sh -n install.sh && bash -n shell/fwt.sh
